name: async-align

services:
  backend:
    build: .
    container_name: async-align-backend
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/async_align
      DB_USERNAME: async_align
      DB_PASSWORD: async_align
      SERVER_PORT: 8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32-bytes-minimum}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      UPLOAD_ROOT: /app/data/uploads
      DITTO_AI_ENABLED: "true"
      DITTO_AI_BASE_URL: http://ai:8000
      DITTO_INTERNAL_API_KEY: ${DITTO_INTERNAL_API_KEY:-local-ai-internal-key-change-me}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - async-align-uploads:/app/data/uploads

  ai:
    build: ./ai-service
    container_name: async-align-ai
    environment:
      DITTO_LLM_MODE: ${DITTO_LLM_MODE:-mock}
      DITTO_OPENAI_MODEL: ${DITTO_OPENAI_MODEL:-o3-mini}
      DITTO_TRANSLATION_MODEL: ${DITTO_TRANSLATION_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DITTO_INTERNAL_API_KEY: ${DITTO_INTERNAL_API_KEY:-local-ai-internal-key-change-me}
      DITTO_CHECKPOINT_DB: /app/data/ditto_checkpoints.db
    expose:
      - "8000"
    volumes:
      - async-align-ai-checkpoints:/app/data

  postgres:
    image: postgres:17-alpine
    container_name: async-align-postgres
    environment:
      POSTGRES_DB: async_align
      POSTGRES_USER: async_align
      POSTGRES_PASSWORD: async_align
    ports:
      - "5432:5432"
    volumes:
      - async-align-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U async_align -d async_align"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  async-align-postgres-data:
  async-align-uploads:
  async-align-ai-checkpoints:
